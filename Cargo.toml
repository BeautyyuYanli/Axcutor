[workspace]
members = ["crates/axcutor-core", "crates/axcutor-wasm", "crates/axcutor-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
axcutor-core = { path = "crates/axcutor-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
indexmap = { version = "2", features = ["serde"] }
bitvec = "1"
regex = "1"
yaml-rust2 = { version = "0.10", default-features = false }
num-bigint = "0.4"
wasm-bindgen = "=0.2.129"
pyo3 = { version = "0.27.2", features = ["abi3-py310"] }
