# Iterate a child workflow concurrently, then compute sum and range in parallel.
input:
  items: {type: array, items: {type: integer}}
  delay_seconds: {type: integer}
output:
  doubled: {type: array, items: {type: integer}}
  total: {type: integer}
  spread: {type: integer}

graph:
  nodes:
    double:
      # Calls always use absolute logical package names.
      use: workflow:demo.double
      with:
        input:
          value: item
          delay_seconds: delay_seconds
        output:
          value: doubled
      for_each:
        source: items
        item: item
        concurrency: 2

    summarize:
      input: [doubled]
      output:
        total: {type: integer}
      run:
        executor: module
        content: .summarize

    measure_spread:
      input: [doubled]
      output:
        spread: {type: integer}
      run:
        executor: builtin
        content: |
          if not input.doubled:
              return Output(spread=0)
          return Output(spread=max(input.doubled) - min(input.doubled))

  edges:
    - start -> double
    - double -> [summarize, measure_spread] -> end
