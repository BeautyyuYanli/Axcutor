[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "axcutor-playground"
version = "0.1.0"
requires-python = ">=3.11"
description = "Execution HTTP API and persistent file workbench for Axcutor"
dependencies = [
    "axcutor-host==0.1.0",
    "axcutor-runtime==0.1.0",
    "axcutor-core==0.1.0",
    "temporalio>=1.35,<2",
    "starlette>=0.49,<1",
    "uvicorn>=0.38,<1",
]

[project.scripts]
axcutor-playground = "axcutor_playground.cli:main"
