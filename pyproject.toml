[project]
name = "axcutor"
version = "0.1.0"
requires-python = ">=3.11"
description = "Axcutor development workspace"

[tool.uv.workspace]
members = ["crates/axcutor-py", "python/axcutor_runtime", "python/axcutor_host", "python/axcutor_cli", "playground/backend"]

[tool.uv.sources]
axcutor-core = { workspace = true }
axcutor-runtime = { workspace = true }
axcutor-host = { workspace = true }
axcutor-cli = { workspace = true }
axcutor-playground = { workspace = true }

[dependency-groups]
dev = [
  "axcutor-runtime",
  "axcutor-host",
  "axcutor-cli",
  "axcutor-playground",
  "httpx>=0.28,<1",
  "pytest>=8",
  "pytest-asyncio>=1",
  "ruff>=0.14",
  "pyrefly>=1.4.1,<2",
  "types-simplejson>=3.20",
]

[tool.pytest.ini_options]
testpaths = ["tests/runtime", "tests/host", "tests/cli", "playground/backend/tests"]
# Playground tests reuse the fixtures and helpers defined under tests/.
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyrefly]
python-version = "3.11"
project-includes = ["python/axcutor_runtime/src", "python/axcutor_host/src", "python/axcutor_cli/src", "playground/backend/src"]
search-path = ["python/axcutor_runtime/src", "python/axcutor_host/src", "python/axcutor_cli/src", "playground/backend/src"]
check-unannotated-defs = true
# The native Rust extension does not ship Python type stubs.
replace-untyped-imports-with-any = ["axcutor_core"]

[tool.pyrefly.errors]
implicit-any-parameter = "error"
unannotated-return = "error"
unused-ignore = "error"
