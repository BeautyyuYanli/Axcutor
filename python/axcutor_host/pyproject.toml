[project]
name = "axcutor-host"
version = "0.1.0"
requires-python = ">=3.11"
description = "Protocol-independent execution management for Axcutor"
dependencies = [
    "axcutor-runtime==0.1.0",
    "axcutor-core==0.1.0",
    "temporalio>=1.35,<2",
]
